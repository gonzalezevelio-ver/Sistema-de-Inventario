version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: inventario_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventario_db
    ports:
      - "3307:3306"
    volumes:
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    networks:
      - inventario_net

  api:
    build: ./api
    container_name: inventario_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: inventario_db
      PORT: 3000
    depends_on:
      - db
    networks:
      - inventario_net

  web:
    build: ./web
    container_name: inventario_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      API_URL: http://api:3000/api
    depends_on:
      - api
    networks:
      - inventario_net

volumes:
  db_data:

networks:
  inventario_net:
    driver: bridge